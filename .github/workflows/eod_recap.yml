name: 0DTE EOD Recap (16:05 ET)

# FIX: was two crons (5 20 and 5 21) causing duplicate runs every day
# during DST (both fire, 60 min apart). Now single cron at 20:10 UTC
# (16:10 EDT) with +5 min buffer for GitHub Actions queue jitter.
# When EST resumes (Nov), change to: "10 21 * * 1-5"
on:
  schedule:
    - cron: "10 20 * * 1-5"   # 16:10 ET during EDT (UTC-4) — DST active now
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: eod-recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRADIER_TOKEN:      ${{ secrets.TRADIER_TOKEN }}
      TRADIER_BASE_URL:   ${{ secrets.TRADIER_BASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      LOG_LEVEL:          INFO

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run EOD recap
        run: python -m src.eod
