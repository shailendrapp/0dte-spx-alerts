name: 0DTE Morning Alert (09:32 ET)

on:
  schedule:
    # GitHub cron is UTC.  09:32 ET = 13:32 UTC (DST, Mar–Nov) or 14:32 UTC (EST, Nov–Mar).
    # Both schedules run; the script self-checks the local ET time and exits if outside ±12 min.
    - cron: "32 13 * * 1-5"   # 09:32 ET in DST
    - cron: "32 14 * * 1-5"   # 09:32 ET in EST
  workflow_dispatch: {}        # allow manual trigger from the Actions tab

permissions:
  contents: write              # so the workflow can commit state/today.json

concurrency:
  group: morning-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run morning alert
        run: python -m src.morning
